{% extends "base.html" %}
{% block title %}Register: E-Mart{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="mb-3">Create an account</h3>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">I want to</label>
            <select name="role" id="role" class="form-select" onchange="toggleSeller()">
              <option value="customer" {{ 'selected' if form.get('role') != 'seller' }}>Buy products (Customer)</option>
              <option value="seller" {{ 'selected' if form.get('role') == 'seller' }}>Sell products (Seller)</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input type="text" name="name" class="form-control" value="{{ form.get('name', '') }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" value="{{ form.get('email', '') }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password (min 6 characters)</label>
            <input type="password" name="password" class="form-control" required>
          </div>

          <div id="seller-fields" style="display:none;">
            <div class="mb-3">
              <label class="form-label">Store name</label>
              <input type="text" name="store_name" class="form-control" value="{{ form.get('store_name', '') }}">
            </div>
            <div class="mb-3">
              <label class="form-label">Store description (optional)</label>
              <textarea name="store_description" class="form-control" rows="2">{{ form.get('store_description', '') }}</textarea>
            </div>
          </div>

          <button class="btn btn-success w-100">Register</button>
        </form>
        <p class="mt-3 mb-0">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
      </div>
    </div>
  </div>
</div>

<script>
  function toggleSeller() {
    document.getElementById("seller-fields").style.display =
      document.getElementById("role").value === "seller" ? "block" : "none";
  }
  toggleSeller();
</script>
{% endblock %}
